<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Garagem do Sorvete</title>
</head>
<header>
</header>
<body>
    <div class="Gasto_mensal">
        <h1 class="titulo">Gasto mensal</h1>
        <div class="linha_subtitulo">
            <h2 class="titulo_material_bruto" id="titulo_material_bruto">material bruto</h2>
            <h2 class="titulo_quantidade" id="titulo_quantidade">quantidade</h2>
            <h2 class="titulo_tipo" id="titulo_tipo">tipo</h2>
            <h2 class="titulo_valor" id="titulo_valor">valor</h2>
            <h2 class="titulo_valor_unitario" id="titulo_valor_unitario">valor unitario</h2>
        </div>        
        <div class="linha_inputs">
            <input type="text" id="input_material_bruto"></input>
             <input type="number" id="input_quantidade" placeholder="Digite a quantidade"/>
                <select id="input_tipo">
                    <option value="kg">Kg</option>
                    <option value="g">Gramas (g)</option>
                    <option value="l">Litros (L)</option>
                    <option value="ml">Mililitros (ml)</option>
                    <option value="un">Inteiro (un)</option>
                </select>
            <input type="text" id="input_valor"></input>
            <a class="valor_unitario" id="valor_unitario">none</a>
        </div>     
    </div>
    <div class="Gerenciador_preço">
        <h1 class="titulo_Gerenciador_preço">Gerenciador de preço</h1>
        <div class="linha_subtitulo_Gerenciador_preço">
            <h2 class="titulo_produto_pronto">produto pronto</h2>
            <h2 class="titulo_Materiais_usados">Materiais usados</h2>
            <h2 class="titulo_quantidade">quantidade</h2>
            <h2 class="titulo_preço_final">preço final</h2>
            <h2 class="titulo_custo">custo</h2>
            <h2 class="titulo_margen_lucro_real">margen lucro real</h2>
            <h2 class="titulo_lucro_desejavel">lucro desejavel</h2>
            <h2 class="titulo_margen_lucro_desejavel">margen lucro desejavel</h2>
            <h2 class="titulo_Diferença_lucro">Diferença lucro</h2>
            <h2 class="titulo_diferença_de_margen">diferença de margen</h2>
        </div>        
        <div class="linha_inputs_Gerenciador_preço">
            <input type="text" class="input_Gerenciador_preço"></input>
            <input type="text" class="input_Gerenciador_preço"></input>
            <input type="text" class="input_Gerenciador_preço"></input>
            <input type="text" class="input_Gerenciador_preço"></input>
            <input type="text" class="input_Gerenciador_preço"></input>
            <input type="text" class="input_Gerenciador_preço"></input>
            <input type="text" class="input_Gerenciador_preço"></input>
            <input type="text" class="input_Gerenciador_preço"></input>
            <input type="text" class="input_Gerenciador_preço"></input>
            <input type="text" class="input_Gerenciador_preço"></input>
        </div> 
    </div>
